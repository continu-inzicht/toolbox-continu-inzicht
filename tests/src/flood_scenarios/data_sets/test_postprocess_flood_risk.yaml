    combined_failure_probability_data:
        type: csv
        path: "test_data_grouped_sections_failure_probability.csv"
    flood_risk_results_per_segment:
        type: csv
        path: "flood_risk_results_per_segment.csv"
    areas_to_determining_sections:
        type: csv
        path: "hidden_areas_to_determining_sections.csv"
